name: Test

on:
  push:
    branches: [main]
    paths:
      - default.json
      - tests/**
      - package.json
      - package-lock.json
      - mise.toml
      - mise.lock
      - .github/workflows/test.yml
  pull_request:
    paths:
      - default.json
      - tests/**
      - package.json
      - package-lock.json
      - mise.toml
      - mise.lock
      - .github/workflows/test.yml

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise and tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
