name: Test

on:
  push:
    branches: [main]
    paths:
      - default.json
      - tests/**
      - package.json
      - package-lock.json
      - mise.toml
      - mise.lock
      - .github/workflows/test.yml
  pull_request:
    paths:
      - default.json
      - tests/**
      - package.json
      - package-lock.json
      - mise.toml
      - mise.lock
      - .github/workflows/test.yml

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise and tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
