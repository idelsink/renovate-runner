name: Mise lockfile sync

on:
  pull_request:
    paths:
      - 'mise.toml'
      - '.mise.toml'
      - 'mise.lock'
      - '.mise.lock'
      - 'mise.*.toml'
      - '.mise.*.toml'
      - 'mise/config.toml'
      - '.mise/config.toml'
      - '.config/mise.toml'
      - '.config/mise/config.toml'
      - '.config/mise/conf.d/*.toml'
      - '.github/workflows/mise-lockfile-sync.yml'

jobs:
  sync-lockfile:
    name: Sync mise lockfile
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false

      - name: Regenerate mise.lock
        run: mise lock

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'chore: regenerate mise.lock'
          file_pattern: 'mise.lock'
